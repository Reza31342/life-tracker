<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EEE3">
<title>Life Tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script>
  // Theme before the first paint (same rules as applyLook in app.js). Device-only preferences.
  try {
    var p = JSON.parse(localStorage.getItem('life-tracker.prefs') || '{}');
    var dark = p.theme === 'dark' || (p.theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.accent = p.accent || 'ink';
  } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <span class="brand">Life Tracker</span>
  <a class="counts" id="counts" href="#tasks" aria-label="Task counts, open the task list"></a>
  <span class="sync" id="sync" aria-live="polite"></span>
  <button class="undo-btn" id="undo" type="button" data-act="undo" disabled title="Nothing to undo"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5 3.5 9l4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h7.5a5 5 0 0 1 0 10H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Undo</span></button>
  <nav class="nav" aria-label="Main">
    <a href="#home" data-route="home">Home</a>
    <a href="#tasks" data-route="tasks">Tasks</a>
    <a href="#picks" data-route="picks">Picks</a>
    <a href="#trends" data-route="trends">Trends</a>
    <a href="#settings" data-route="settings">Settings</a>
  </nav>
</header>
<main id="view"></main>
<nav class="bottom" aria-label="Main">
  <a href="#home" data-route="home">Home</a>
  <a href="#tasks" data-route="tasks">Tasks</a>
  <a href="#picks" data-route="picks">Picks</a>
  <a href="#trends" data-route="trends">Trends</a>
  <a href="#settings" data-route="settings">More</a>
</nav>
<dialog id="edit" class="edit-dialog" aria-labelledby="edit-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
