<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<title>Life Tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" aria-label="Main">
    <div class="brand">Life Tracker</div>
    <a href="#today" data-route="today">Today</a>
    <a href="#tasks" data-route="tasks">Tasks</a>
    <a href="#picks" data-route="picks">Picks</a>
    <a href="#settings" data-route="settings">Settings</a>
  </nav>
  <main id="view" class="view"></main>
</div>
<nav class="tabbar" aria-label="Main">
  <a href="#today" data-route="today">Today</a>
  <a href="#tasks" data-route="tasks">Tasks</a>
  <a href="#picks" data-route="picks">Picks</a>
  <a href="#settings" data-route="settings">Settings</a>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
